name: Extend PDF import UI

on:
  push:
    branches:
      - feat/pp-income-tax-delivery-imports
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pp-income-tax-delivery-imports
          fetch-depth: 0

      - name: Patch UI for extended broker events
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/etf-tax-assistant.tsx")
          text = path.read_text()

          replacements = [
              (
                  'import { currentUnitsByIsin, parseBrokerPdfText, unitsAtDate } from "../lib/broker-transactions";',
                  'import { brokerTransactionTypeLabels, currentUnitsByIsin, parseBrokerPdfText, unitsAtDate } from "../lib/broker-transactions";'
              ),
              (
                  'const uniqueIsins = [...new Set(imported.map((item) => item.isin))];',
                  'const uniqueIsins = [...new Set(imported.flatMap((item) => item.isin ? [item.isin] : []))];'
              ),
              (
                  'Kauf- und Verkaufs-PDFs einlesen. Das Tool erkennt ISIN, Datum und Stückzahl und berechnet daraus den Bestand am OeKB-Meldetag.',
                  'Broker-PDFs für Käufe, Verkäufe, Dividenden, Steuern, Gebühren und Depotüberträge einlesen. Bestandswirksame Belege werden automatisch für den OeKB-Meldetag berücksichtigt.'
              ),
              (
                  'Trade Republic, Scalable, Flatex, DEGIRO, IBKR und ähnliche Text-PDFs',
                  'PP-artige Erkennung · u. a. Flatex, Scalable/Baader, Trade Republic, DEGIRO, IBKR und DADAT'
              ),
              (
                  '{transactionBalances.length > 0 && <details className="transaction-summary">',
                  '{transactions.length > 0 && <details className="transaction-summary">'
              ),
              (
                  'Aktuell errechneter Bestand aus allen Käufen minus Verkäufen',
                  'Bestand aus Käufen, Verkäufen und Depotüberträgen; Ertrags- und Steuerereignisse bleiben im Journal'
              ),
              (
                  '{balance.transactions} Kauf-/Verkaufsbelege',
                  '{balance.transactions} bestandswirksame Belege'
              ),
              (
                  '{item.type === "buy" ? "Kauf" : "Verkauf"}',
                  '{brokerTransactionTypeLabels[item.type]}'
              ),
              (
                  '{formatShortDate(item.date)} · {item.isin}',
                  '{formatShortDate(item.date)} · {item.isin ?? "Kontobeleg"}'
              ),
              (
                  '{item.units.toLocaleString("de-AT", { maximumFractionDigits: 8 })} Stk.',
                  '{formatBrokerTransactionValue(item)}'
              ),
              (
                  'Kauf-/Verkaufstransaktion{brokerUnitsAtReport.matchedTransactions === 1 ? "" : "en"}',
                  'bestandswirksame Transaktion{brokerUnitsAtReport.matchedTransactions === 1 ? "" : "en"}'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected UI fragment not found: {old[:100]}")
              text = text.replace(old, new, 1)

          helper_anchor = '''function formatShortDate(date: string | null | undefined) {
            if (!date) return null;
            const parsed = new Date(`${date}T00:00:00Z`);
            return Number.isNaN(parsed.getTime()) ? date : shortDateFormatter.format(parsed);
          }
          '''
          helper = helper_anchor + '''
          function formatBrokerTransactionValue(item: BrokerTransaction) {
            if ((item.type === "buy" || item.type === "sell" || item.type === "delivery_in" || item.type === "delivery_out") && item.units !== null) {
              return `${item.units.toLocaleString("de-AT", { maximumFractionDigits: 8 })} Stk.`;
            }
            if (item.amount !== null) {
              return `${item.amount.toLocaleString("de-AT", { maximumFractionDigits: 2 })}${item.currency ? ` ${item.currency}` : ""}`;
            }
            if (item.units !== null) return `${item.units.toLocaleString("de-AT", { maximumFractionDigits: 8 })} Stk.`;
            return "—";
          }
          '''
          if helper_anchor not in text:
              raise SystemExit("formatShortDate anchor not found")
          text = text.replace(helper_anchor, helper, 1)
          path.write_text(text)

          css = Path("app/globals.css")
          styles = css.read_text()
          marker = "/* extended broker PDF event types */"
          if marker not in styles:
              styles += '''

          /* extended broker PDF event types */
          .trade-type.dividend { background:#e8f0f4; color:#315f77; }
          .trade-type.tax { background:#fff0e9; color:#9b503a; }
          .trade-type.tax_refund { background:#e8f3e8; color:#337044; }
          .trade-type.fee { background:#f2edf5; color:#725482; }
          .trade-type.fee_refund { background:#edf4ef; color:#3e7051; }
          .trade-type.delivery_in { background:#e3f2e9; color:#24684d; }
          .trade-type.delivery_out { background:#fff0e9; color:#a3573e; }
          '''
              css.write_text(styles)

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests and production build
        run: npm test

      - name: Commit validated UI changes and remove temporary workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/extend-pdf-import.yml
          git add app/etf-tax-assistant.tsx app/globals.css
          git commit -m "Wire extended broker events into UI"
          git push origin HEAD:feat/pp-income-tax-delivery-imports
